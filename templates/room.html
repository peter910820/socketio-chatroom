<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chatroom {{ room_name }}</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.js"></script>
    <script type="text/javascript" charset="utf-8">
        document.addEventListener('DOMContentLoaded', (event) => {
            let socket = io();
            socket.on("connect", function() {
                socket.emit('join', '{{ room_name }}', '{{ username }}');
                console.log(`Connected to {{ room_name }} room`);
            });
            socket.on('join', function(msg) {
                    let div = document.createElement('div');
                    div.innerText = msg;
                    let msgComponet = document.getElementById('messages').firstChild;
                    document.getElementById('messages').insertBefore(div, msgComponet);
            });
            socket.on('message', function(data) {
                    let div = document.createElement('div');

                    let usernameSpan = document.createElement('span');
                    usernameSpan.innerText = `${data["username"]}> `;
                    usernameSpan.className = 'username-style';

                    let msgSpan = document.createElement('span');
                    msgSpan.innerText = `${data["msg"]}`;

                    div.appendChild(usernameSpan);
                    div.appendChild(msgSpan);
                    let firstComponet = document.getElementById('messages').firstChild;
                    document.getElementById('messages').insertBefore(div, firstComponet);
            });
            document.getElementById('send').onclick = function() {
                    let message = document.getElementById('input').value;
                    socket.emit('message', {room_id: '{{ room_name }}', msg: message, username: "{{ username }}"});
                    document.getElementById('input').value = '';
            };
        })
    </script>
</head>
<body>
    <div class="row">
        <div class="col s12 banner">
            <div>
                <p>你正在{{ room_name }} chatroom</p>
                <p>歡迎使用者: {{ username }}</p>
            </div>
        </div>
        <div class="col s12 chat-block">
            <div class="input-field">
                <div class="col s8">
                    <input id="input" name="input" type="text" class="validate">
                </div>
                <div class="col s4">
                    <button id="send" class="btn waves-effect waves-light" type="submit" name="action">Submit
                        <i class="material-icons right">send</i>
                    </button>
                </div>
            </div>
            <div class="col s12 messages">
                <div id="messages" class="scrollbar" style="overflow-y: auto;" />
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</html>
