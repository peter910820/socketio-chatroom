<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!-- Compiled and minified CSS -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
     <link rel="stylesheet" href="../static/style.css">
    <title>chatroom</title>
</head>
<body>
    <div class="row">
        <div class="col s12 banner">
            <div>
                <p>socketio-chatroom</p>
                <p>使用socketio製作的簡易聊天室</p>
            </div>
        </div>
        <div class="col s12 form">
            <form id="form" method="POST" onsubmit="router(event)">
                <div class="input-field col s12">
                    <input id="username" name="username" type="text" class="validate">
                    <label for="username">使用者姓名</label>
                </div>
                <div class="input-field col s12">
                    <input id="roomnumber" name="roomnumber" type="text" class="validate">
                    <label for="roomnumber">房間號碼</label>
                </div>
                <button type="submit" class="btn-floating btn-large waves-effect waves-light red"><i class="material-icons">Go</i></button>
            </form>
        </div>
        <!-- <div class="col s12">
            <ul id="messages"></ul>
        </div> -->
    </div>
    <!-- Compiled and minified JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script>
        function router(event) {
            event.preventDefault();  // 防止表單提交
            const form = document.getElementById('form');
            const inputUsername = document.getElementById('username').value.trim();
            const inputRoomnumber = document.getElementById('roomnumber').value.trim();

            if (inputUsername !== '' && roomnumber !== '') {
                form.setAttribute('action', `/room/${inputRoomnumber}`);
                form.submit();  // 提交表單
            } else {
                alert('input is null!');
            }
        }
    </script>
</body>
</html>
